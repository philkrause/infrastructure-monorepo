name: Terraform Debug Workflow

on:
  push:
    branches:
      - '**' # Trigger on push to any branch
  workflow_dispatch:

jobs:
  extract-branch-info:
    runs-on: ubuntu-latest
    outputs:
      tfvars_project_name: ${{ steps.extract.outputs.tfvars_project_name }}
      environment: ${{ steps.extract.outputs.environment }}
      working_directory: ${{ steps.extract.outputs.working_directory }}
      gcp_project_id: ${{ steps.extract.outputs.gcp_project_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract branch info
        id: extract
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Debug: Listing / (root) directory contents:"
          ls -l /
          echo "Branch Name: $BRANCH_NAME"

          TFVARS_PROJECT_NAME=""
          ENVIRONMENT=""
          WORKING_DIRECTORY=""
          GCP_PROJECT_ID=""

          if [[ $BRANCH_NAME =~ ^customer-([a-zA-Z0-9-]+)-([a-zA-Z0-9]+)-.*$ ]]; then
            CUSTOMER_ID="${BASH_REMATCH[1]}"
            ENVIRONMENT="${BASH_REMATCH[2]}"
            TFVARS_PROJECT_NAME="customer-$CUSTOMER_ID"
            WORKING_DIRECTORY="terraform/projects/customer-$CUSTOMER_ID"
            GCP_PROJECT_ID="caddi-us-c-${CUSTOMER_ID}-${ENVIRONMENT}"
            echo "Customer Project Detected"
          elif [[ $BRANCH_NAME =~ ^shared-([a-zA-Z0-9]+)-.*$ ]]; then
            ENVIRONMENT="${BASH_REMATCH[1]}"
            TFVARS_PROJECT_NAME="shared-infrastructure"
            WORKING_DIRECTORY="terraform/projects/shared-infrastructure"
            TFVARS_FILE_PATH="terraform/projects/shared-infrastructure/${ENVIRONMENT}.tfvars"
            echo "Debug: Checking directory: terraform/projects/shared-infrastructure/"
            ls -l terraform/projects/shared-infrastructure/
            echo "Debug: Checking TFVARS_FILE_PATH: $TFVARS_FILE_PATH"
            if [ -f "$TFVARS_FILE_PATH" ]; then
              GCP_PROJECT_ID=$(grep -oP 'gcp_project_id = "\K[^"]+' "$TFVARS_FILE_PATH" || echo "")
              if [ -z "$GCP_PROJECT_ID" ]; then
                echo "Error: gcp_project_id not found in $TFVARS_FILE_PATH"
                exit 1
              fi
            else
              echo "Error: TFVARS file not found at $TFVARS_FILE_PATH"
              exit 1
            fi
            echo "Shared Infrastructure Project Detected"
          else
            echo "Error: Branch name does not match expected pattern."
            exit 1
          fi

          echo "tfvars_project_name=$TFVARS_PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "working_directory=$WORKING_DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "gcp_project_id=$GCP_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Debug: TFVARS_PROJECT_NAME = $TFVARS_PROJECT_NAME"
          echo "Debug: ENVIRONMENT = $ENVIRONMENT"
          echo "Debug: WORKING_DIRECTORY = $WORKING_DIRECTORY"
          echo "Debug: GCP_PROJECT_ID = $GCP_PROJECT_ID"

  terraform-plan:
    needs: extract-branch-info
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ needs.extract-branch-info.outputs.gcp_project_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.x.x

      - name: Terraform Init
        working-directory: ${{ needs.extract-branch-info.outputs.working_directory }}
        run: terraform init

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ needs.extract-branch-info.outputs.working_directory }}
          soft_fail: true

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v3

      - name: Run tflint
        working-directory: ${{ needs.extract-branch-info.outputs.working_directory }}
        run: tflint --no-color

      - name: Terraform Format Check
        working-directory: ${{ needs.extract-branch-info.outputs.working_directory }}
        run: terraform fmt -check=true

      - name: Terraform Validate
        working-directory: ${{ needs.extract-branch-info.outputs.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ needs.extract-branch-info.outputs.working_directory }}
        run: |
          terraform plan -no-color -var-file=./${{ needs.extract-branch-info.outputs.environment }}.tfvars